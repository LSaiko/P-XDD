name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dental-detector .
      - name: Start container and check /health
        run: |
          docker run -d -p 8000:8000 --name dental-detector dental-detector
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs dental-detector
          exit 1
